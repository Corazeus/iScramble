name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Inject Gemini API key
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: sed -i "s|YOUR_GEMINI_API_KEY|${API_KEY}|g" script.js

      - name: Verify injection worked
        run: |
          if grep -q "YOUR_GEMINI_API_KEY" script.js; then
            echo "ERROR: Key was NOT replaced - placeholder still in file"
            exit 1
          else
            echo "SUCCESS: Placeholder was replaced"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4